name: Docker Build and Push
on:
  push:
    tags:
      - "v*"

concurrency:
  group: docker-build-push
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write # Cosign Keyless署名に必須

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMUはBuildxの前にセットアップするのが推奨
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Harborへのログイン
      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.uniproject.jp
          # Harborのロボットアカウント名は 'robot$name' の形式なのでシングルクォートで囲むのが安全
          username: 'robot$rielu-site3+github-publisher'
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Add metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.uniproject.jp/rielu-site3/rielu-site3
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6 # 最新のv6/v7系を利用
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Harbor上のレジストリキャッシュを利用
          cache-from: type=registry,ref=registry.uniproject.jp/rielu/rielu-official-site:buildcache
          cache-to: type=registry,ref=registry.uniproject.jp/rielu/rielu-official-site:buildcache,mode=max

      # 署名ステップ
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker images with GitHub OIDC
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            # Harborのタグに対して署名を付与
            cosign sign --yes "${tag}@${DIGEST}"
          done