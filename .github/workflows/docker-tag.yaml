name: Docker Build and Push
on:
  workflow_dispatch:
  push:
    branches:
      - "master"

permissions:
  contents: write  # Gitタグを書き込むために必要
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全履歴を取得しないと最新タグが計算できない

      # 1. 最新のタグを取得し、パッチバージョンを+1する
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch # デフォルトで 1.2.2 -> 1.2.3 にする

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: registry.uniproject.jp
          username: 'robot$rielu-site3+github-publisher'
          password: ${{ secrets.HARBOR_TOKEN }}

      # 2. 自動生成された new_tag (v1.x.x) をイメージに付与
      - name: Add metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: registry.uniproject.jp/rielu-site3/rielu-site3
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag_version.outputs.new_tag }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=registry.uniproject.jp/rielu-site3/rielu-site3:buildcache
          cache-to: type=registry,ref=registry.uniproject.jp/rielu-site3/rielu-site3:buildcache,mode=max

      # 3. 署名 (自動生成されたタグに対しても実行)
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          COSIGN_YES: true  # ← これを追加（重要）
        run: |
          # 1行ずつタグを取り出して署名を実行
          echo "$TAGS" | xargs -I {} cosign sign --yes "{}@${DIGEST}"
